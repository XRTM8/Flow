[package]
name = "otium-flow"
version = "0.1.0"
edition = "2021"
default-run = "otium-flow-app"

[lib]
name = "otium_flow"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "otium-flow-app"
path = "src/main.rs"

[dependencies]
slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17.2"
chacha20poly1305 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"

[build-dependencies]
slint-build = "1.18"

[package.metadata.android]
package = "org.otium.flow"
label = "FLOW by Otium"
version_code = 1
min_sdk_version = 26
target_sdk_version = 34
icon = "@mipmap/ic_launcher"

