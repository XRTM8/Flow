[package]
name = "otium-flow"
version = "2.2.0"
edition = "2021"
default-run = "otium-flow-app"

[lib]
name = "otium_flow"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "otium-flow-app"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = "1.18"
rfd = "0.17.2"
arboard = "3.4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"
ndk-context = "0.1"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.android]
package = "org.otium.flow"
label = "FLOW by Otium"
icon = "@mipmap/ic_launcher"
resources = "res"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.application]
label = "FLOW by Otium"
icon = "@mipmap/ic_launcher"
request_legacy_external_storage = true

[package.metadata.android.signing.release]
path = "flow.keystore"
keystore_password = "otiumflow123"
key_alias = "flowkey"
key_password = "otiumflow123"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_WIFI_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_WIFI_MULTICAST_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"



[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
